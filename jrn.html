<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Madhav — Computer Science</title>


    <!-- =========================
         GOOGLE SEARCH CONSOLE
         VERIFICATION
    ========================== -->

    <meta
        name="google-site-verification"
        content="Z7JVcVXh2NxwYOJliM_YJ573FRlTO6uUuJpPV9vIQXw"
    >


    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         INTRO SCREEN
    ========================== -->

    <section
        id="introScreen"
        class="intro-screen"
    >

        <!-- INTRO VIDEO -->

        <video
            id="krishnaVideo"
            class="intro-video"
            autoplay
            muted
            playsinline
        >

            <!--
                IMPORTANT:
                Put your video in the same folder
                as index.html and name it krishna.mp4
            -->

            <source
                src="krishna.mp4"
                type="video/mp4"
            >

            Your browser does not support video.

        </video>


        <!-- DARK VIDEO OVERLAY -->

        <div class="video-overlay"></div>


        <!-- INTRO TEXT -->

        <div class="intro-content">

            <p class="intro-small">
                WELCOME
            </p>


            <h1>
                MADHAV
            </h1>


            <p>
                Computer Science
            </p>


            <button
                id="enterButton"
            >
                ENTER MADHAV
            </button>

        </div>

    </section>



    <!-- =========================
         MAIN WEBSITE
    ========================== -->

    <main
        id="mainWebsite"
        class="hidden"
    >


        <!-- =========================
             NAVIGATION
        ========================== -->

        <header class="navbar">

            <div class="logo">
                MADHAV
            </div>


            <div class="subtitle">
                Computer Science
            </div>

        </header>



        <!-- =========================
             HERO
        ========================== -->

        <section class="hero">

            <p class="eyebrow">
                COMPUTER SCIENCE LIBRARY
            </p>


            <h2>
                Learn.<br>
                Build.<br>
                Understand.
            </h2>


            <p class="hero-text">
                Explore your Computer Science
                study materials and documents.
            </p>

        </section>



        <!-- =========================
             PDF LIBRARY
        ========================== -->

        <section class="library">

            <div class="section-heading">

                <p class="eyebrow">
                    YOUR MATERIALS
                </p>


                <h2>
                    Choose a PDF
                </h2>

            </div>


            <!--
                JavaScript will automatically
                put the two PDFs here.
            -->

            <div
                id="pdfList"
                class="pdf-list"
            >

            </div>

        </section>



        <!-- =========================
             FOOTER
        ========================== -->

        <footer>

            <h3>
                MADHAV
            </h3>


            <p>
                A simple space for Computer Science.
            </p>


            <p class="copyright">
                Made with ❤️
            </p>

        </footer>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
