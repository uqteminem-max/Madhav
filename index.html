<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="google-site-verification" content="Z7JVcVXh2NxwYOJliM_YJ573FRlTO6uUuJpPV9vIQXw" />

    <title>Chitram — Stories in Frames</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         WELCOME SCREEN
    ========================== -->

    <section id="welcomeScreen" class="welcome-screen">

        <div class="welcome-content">

            <p class="small-title">WELCOME TO</p>

            <h1>Chitram</h1>

            <p class="tagline">
                Stories captured in frames.
            </p>

            <div class="nature-question">

                <h2>Do you love nature?</h2>

                <p>
                    Come on, we already know the answer.
                </p>

                <div class="choice-buttons">

                    <button type="button" onclick="enterGallery()">
                        YES 🌿
                    </button>

                    <button type="button" onclick="enterGallery()">
                        YESSSS 🌿✨
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- =========================
         GALLERY
    ========================== -->

    <main id="galleryScreen" class="gallery-screen">

        <header class="navbar">

            <div class="logo">
                Chitram<span>.</span>
            </div>

            <div class="nav-text">
                Nature • Moments • Stories
            </div>

        </header>


        <section class="gallery-intro">

            <p class="eyebrow">
                A COLLECTION OF MOMENTS
            </p>

            <h2>
                Captured by me.
            </h2>

            <p>
                Every frame has a story.
            </p>

        </section>


        <!-- Images are inserted here by JavaScript -->

        <section id="gallery" class="gallery"></section>


        <footer>

            <p>
                Made by Jyoti Ranjan Nayak❤️
            </p>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
